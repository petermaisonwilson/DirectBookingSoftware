name: Direct Booking AWS Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - aws-readiness-database-portability

jobs:
  windows-sqlite:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-online.txt
      - name: Compile all Python source
        run: python -m compileall -q online tests run_online.py
      - run: python tests/aws_readiness_config_test.py
      - run: python tests/web_v1_availability_calendar_test.py
      - run: python tests/web_v1_booking_workflow_test.py

  linux-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-online.txt
      - name: Compile all Python source
        run: python -m compileall -q online tests run_online.py
      - run: python tests/aws_readiness_config_test.py
      - run: python tests/web_v1_availability_calendar_test.py
      - run: python tests/web_v1_booking_workflow_test.py

  linux-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: directbooking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d directbooking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECTBOOKING_ENV: test
      DIRECTBOOKING_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/directbooking_test
      DIRECTBOOKING_SEED_DEMO: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-online.txt
      - name: Compile all Python source
        run: python -m compileall -q online tests run_online.py
      - run: alembic upgrade head
      - run: python tests/aws_readiness_postgres_test.py
      - run: python -c "from online.app import create_app; from online.webv1 import register_web_v1; print('DBS Linux/PostgreSQL imports passed')"
