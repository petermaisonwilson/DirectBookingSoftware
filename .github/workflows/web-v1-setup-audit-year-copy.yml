name: Direct Booking Setup Audit Year Copy

on:
  push:
    branches:
      - web-v1-setup-audit-year-copy
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-setup-audit-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install online dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-online.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
      - name: Verify new feature imports
        shell: pwsh
        run: |
          python -c "from online.setup015_year_audit import register_year_audit_routes, _audit_items, _clone_year; from online.setup015_year_delete_page import register_year_delete_page; from online.setup015_elements_no_base_price import register_elements_no_base_price; assert register_year_audit_routes and _audit_items and _clone_year and register_year_delete_page and register_elements_no_base_price; print('Setup audit imports: passed')"
          if ($LASTEXITCODE -ne 0) { throw "Setup audit import verification failed" }
      - name: Run Setup Audit and Year Copy regression
        shell: pwsh
        run: |
          python tests/web_v1_setup_year_audit_test.py
          if ($LASTEXITCODE -ne 0) { throw "Setup Audit / Year Copy regression failed" }
      - name: Run Element and Year cleanup regression
        shell: pwsh
        run: |
          python tests/web_v1_element_year_cleanup_test.py
          if ($LASTEXITCODE -ne 0) { throw "Element / Year cleanup regression failed" }
