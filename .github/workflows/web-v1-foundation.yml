name: Direct Booking Web V1

on:
  push:
    branches:
      - web-v1-foundation
      - web-v1-client-register-enquiry
      - web-v1-enquiry-search
      - web-v1-operations-navigation
      - web-v1-full-enquiry
      - web-v1-integrated-enquiry
      - web-v1-addon-when
      - web-v1-persistent-data
      - web-v1-addon-person-pricing
      - web-v1-addon-picker
      - web-v1-setup-maintenance
      - web-v1-availability-foundation
      - web-v1-availability-calendar
      - web-v1-booking-status-workflow
      - web-v1-booking-workflow
      - web-v1-booking-edit-hold-warning
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-web-v1-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Web V1 files
        shell: pwsh
        run: |
          $required = @(
            "online/webv1.py",
            "online/webv1_core.py",
            "online/webv1_routes.py",
            "online/webv1_customers.py",
            "online/webv1_enquiries.py",
            "online/webv1_enquiry_builder.py",
            "online/webv1_addon_when.py",
            "online/webv1_addon_person.py",
            "online/webv1_availability.py",
            "online/webv1_booking_status.py",
            "online/webv1_bookings.py",
            "online/webv1_hold_settings.py",
            "online/webv1_hold_warning_ui.py",
            "online/webv1_status_availability.py",
            "online/webv1_calendar_v2.py",
            "online/webv1_calendar_v3.py",
            "online/webv1_calendar_refresh.py",
            "online/setup015.py",
            "online/setup015_maintenance.py",
            "online/setup015_element_availability_page.py",
            "run_online.py",
            "START_WEB_V1.bat",
            "requirements-online.txt",
            "tests/web_v1_foundation_test.py",
            "tests/web_v1_launcher_identity_test.py",
            "tests/web_v1_client_register_test.py",
            "tests/web_v1_enquiry_search_test.py",
            "tests/web_v1_operations_navigation_test.py",
            "tests/web_v1_full_enquiry_test.py",
            "tests/web_v1_addon_when_test.py",
            "tests/web_v1_addon_person_pricing_test.py",
            "tests/web_v1_addon_picker_test.py",
            "tests/web_v1_setup_maintenance_test.py",
            "tests/web_v1_availability_foundation_test.py",
            "tests/web_v1_availability_calendar_test.py",
            "tests/web_v1_booking_edit_hold_warning_test.py",
            "tests/web_v1_hold_settings_test.py",
            "tests/web_v1_booking_workflow_test.py",
            "tests/web_v1_persistent_data_test.py",
            "tests/online_setup015_test.py",
            "WEB_V1_FOUNDATION.md"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing Web V1 file: $file" }
          }

      - name: Test Windows starter Python detection
        shell: cmd
        env:
          DIRECTBOOKING_LAUNCHER_TEST: "1"
        run: START_WEB_V1.bat

      - name: Install online dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-online.txt
          if ($LASTEXITCODE -ne 0) { throw "Web dependency installation failed" }

      - name: Verify launcher identity and occupied-port protection
        shell: pwsh
        run: |
          python tests/web_v1_launcher_identity_test.py
          if ($LASTEXITCODE -ne 0) { throw "Launcher identity / occupied-port protection failed" }

      - name: Verify Web V1 imports
        shell: pwsh
        run: |
          python -c "from online.app import app; from online.webv1 import register_web_v1, initialise_web_v1; from online.webv1_customers import register_customer_routes; from online.webv1_enquiries import register_enquiry_routes; from online.webv1_enquiry_builder import register_enquiry_builder_routes; from online.webv1_addon_when import register_addon_when_routes; from online.webv1_addon_person import initialise_addon_person; from online.webv1_availability import initialise_availability, register_availability_routes; from online.webv1_booking_status import initialise_booking_statuses, register_booking_status_routes; from online.webv1_bookings import initialise_booking_workflow, register_booking_routes, convert_enquiry; from online.webv1_hold_settings import initialise_hold_settings, hold_timing, register_hold_settings_routes; from online.webv1_status_availability import availability_state, available_elements, install_status_aware_availability; from online.webv1_calendar_v2 import register_calendar_v2_routes; from online.webv1_calendar_v3 import register_calendar_v3_routes; from online.webv1_calendar_refresh import install_calendar_expiry_refresh; from online.setup015_maintenance import register_setup_maintenance_routes; from online.setup015_element_availability_page import register_element_availability_page; assert app and register_web_v1 and initialise_web_v1 and register_customer_routes and register_enquiry_routes and register_enquiry_builder_routes and register_addon_when_routes and initialise_addon_person and initialise_availability and register_availability_routes and initialise_booking_statuses and register_booking_status_routes and initialise_booking_workflow and register_booking_routes and convert_enquiry and initialise_hold_settings and hold_timing and register_hold_settings_routes and availability_state and available_elements and install_status_aware_availability and register_calendar_v2_routes and register_calendar_v3_routes and install_calendar_expiry_refresh and register_setup_maintenance_routes and register_element_availability_page; print('Web V1 imports: passed')"
          if ($LASTEXITCODE -ne 0) { throw "Web V1 import verification failed" }

      - name: Run proven Setup regression test
        shell: pwsh
        run: |
          python tests/online_setup015_test.py
          if ($LASTEXITCODE -ne 0) { throw "Proven Setup regression test failed" }

      - name: Run Web V1 foundation test
        shell: pwsh
        run: |
          python tests/web_v1_foundation_test.py
          if ($LASTEXITCODE -ne 0) { throw "Web V1 foundation test failed" }

      - name: Run Client Register and New Enquiry test
        shell: pwsh
        run: |
          python tests/web_v1_client_register_test.py
          if ($LASTEXITCODE -ne 0) { throw "Client Register and New Enquiry test failed" }

      - name: Run Enquiry Search test
        shell: pwsh
        run: |
          python tests/web_v1_enquiry_search_test.py
          if ($LASTEXITCODE -ne 0) { throw "Enquiry Search test failed" }

      - name: Run Operations navigation test
        shell: pwsh
        run: |
          python tests/web_v1_operations_navigation_test.py
          if ($LASTEXITCODE -ne 0) { throw "Operations navigation test failed" }

      - name: Run integrated New/Edit Enquiry test
        shell: pwsh
        run: |
          python tests/web_v1_full_enquiry_test.py
          if ($LASTEXITCODE -ne 0) { throw "Integrated New/Edit Enquiry test failed" }

      - name: Run Add-on When test
        shell: pwsh
        run: |
          python tests/web_v1_addon_when_test.py
          if ($LASTEXITCODE -ne 0) { throw "Add-on When test failed" }

      - name: Run Add-on Person Type pricing test
        shell: pwsh
        run: |
          python tests/web_v1_addon_person_pricing_test.py
          if ($LASTEXITCODE -ne 0) { throw "Add-on Person Type pricing test failed" }

      - name: Run Add-on picker test
        shell: pwsh
        run: |
          python tests/web_v1_addon_picker_test.py
          if ($LASTEXITCODE -ne 0) { throw "Add-on picker test failed" }

      - name: Run Setup maintenance test
        shell: pwsh
        run: |
          python tests/web_v1_setup_maintenance_test.py
          if ($LASTEXITCODE -ne 0) { throw "Setup maintenance test failed" }

      - name: Run availability foundation test
        shell: pwsh
        run: |
          python tests/web_v1_availability_foundation_test.py
          if ($LASTEXITCODE -ne 0) { throw "Availability foundation test failed" }

      - name: Run status-aware Availability Calendar test
        shell: pwsh
        run: |
          python tests/web_v1_availability_calendar_test.py
          if ($LASTEXITCODE -ne 0) { throw "Status-aware Availability Calendar test failed" }

      - name: Run booking edit and global hold warning test
        shell: pwsh
        run: |
          python tests/web_v1_booking_edit_hold_warning_test.py
          if ($LASTEXITCODE -ne 0) { throw "Booking edit / global hold warning regression failed" }

      - name: Run client-defined hold timing test
        shell: pwsh
        run: |
          python tests/web_v1_hold_settings_test.py
          if ($LASTEXITCODE -ne 0) { throw "Client-defined hold timing test failed" }

      - name: Run Booking workflow test
        shell: pwsh
        run: |
          python tests/web_v1_booking_workflow_test.py
          if ($LASTEXITCODE -ne 0) { throw "Booking workflow test failed" }

      - name: Run persistent local data test
        shell: pwsh
        run: |
          python tests/web_v1_persistent_data_test.py
          if ($LASTEXITCODE -ne 0) { throw "Persistent local data test failed" }

      - name: Launch local server and health check
        shell: pwsh
        run: |
          $env:DIRECTBOOKING_NO_BROWSER = "1"
          $env:DIRECTBOOKING_DB = "$env:RUNNER_TEMP\directbooking-web-v1-health.db"
          $process = Start-Process -FilePath "python" -ArgumentList "run_online.py" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 2
                if ($response.status -eq "ok" -and $response.build -eq "$env:GITHUB_RUN_NUMBER") { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Web V1 local server did not pass health check" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          Write-Host "Web V1 local server health check passed"

      - name: Stage Web V1 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifact\online" | Out-Null
          Copy-Item "online\*.py" "artifact\online\" -Force
          Copy-Item "run_online.py" "artifact\run_online.py" -Force
          Copy-Item "START_WEB_V1.bat" "artifact\START_WEB_V1.bat" -Force
          Copy-Item "requirements-online.txt" "artifact\requirements-online.txt" -Force
          Copy-Item "WEB_V1_FOUNDATION.md" "artifact\WEB_V1_FOUNDATION.md" -Force

      - name: Upload Web V1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectBookingSoftware-Web-V1-Booking-Workflow
          path: artifact/
          if-no-files-found: error
          retention-days: 30
